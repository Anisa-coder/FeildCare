    <ellipse cx="820" cy="217" rx="31" ry="13"/>
    <ellipse cx="900" cy="221" rx="29" ry="15"/>
    <ellipse cx="980" cy="218" rx="26" ry="14"/>
    <ellipse cx="1060" cy="225" rx="30" ry="13"/>
