<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f0fdf4" rx="12"/>
  <g transform="translate(200,150)">
    <!-- Large leaf -->
    <ellipse cx="0" cy="-10" rx="120" ry="100" fill="#4ade80" transform="rotate(-10)"/>
    <line x1="0" y1="-95" x2="0" y2="70" stroke="#166534" stroke-width="3"/>
    <!-- Veins -->
    <line x1="0" y1="-40" x2="-60" y2="-60" stroke="#166534" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="-10" x2="-70" y2="-20" stroke="#166534" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="20" x2="-55" y2="30" stroke="#166534" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="-40" x2="60" y2="-60" stroke="#166534" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="-10" x2="70" y2="-20" stroke="#166534" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="20" x2="55" y2="30" stroke="#166534" stroke-width="1.5" opacity="0.5"/>
    <!-- Early blight spots with concentric rings -->
    <circle cx="-40" cy="-40" r="18" fill="#7c2d12" opacity="0.8"/>
    <circle cx="-40" cy="-40" r="12" fill="none" stroke="#451a03" stroke-width="1" opacity="0.5"/>
    <circle cx="-40" cy="-40" r="6" fill="none" stroke="#451a03" stroke-width="1" opacity="0.5"/>
    <circle cx="30" cy="-10" r="15" fill="#7c2d12" opacity="0.7"/>
    <circle cx="30" cy="-10" r="9" fill="none" stroke="#451a03" stroke-width="1" opacity="0.5"/>
    <circle cx="-10" cy="25" r="12" fill="#92400e" opacity="0.7"/>
    <circle cx="-10" cy="25" r="7" fill="none" stroke="#451a03" stroke-width="1" opacity="0.5"/>
    <circle cx="50" cy="-45" r="10" fill="#7c2d12" opacity="0.6"/>
    <circle cx="-55" cy="5" r="9" fill="#92400e" opacity="0.6"/>
    <!-- Yellow halo around largest spot -->
    <circle cx="-40" cy="-40" r="22" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
  </g>
</svg>
