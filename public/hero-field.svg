<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c8e6c9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a5d6a7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="field" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#66bb6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e7d32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sunlight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff9c4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fff9c4;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#sky)"/>
  <rect y="180" width="1200" height="220" fill="url(#field)" rx="0"/>
  <rect width="1200" height="400" fill="url(#sunlight)" opacity="0.3"/>
  <!-- Crop rows -->
  <g fill="#4caf50" opacity="0.7">
    <ellipse cx="100" cy="220" rx="30" ry="15"/>
