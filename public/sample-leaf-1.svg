<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#f0fdf4" rx="12"/>
  <g transform="translate(100,100)">
    <!-- Leaf shape -->
    <ellipse cx="0" cy="-10" rx="50" ry="65" fill="#4ade80" transform="rotate(-15)"/>
    <line x1="0" y1="-60" x2="0" y2="40" stroke="#166534" stroke-width="2"/>
    <!-- Disease spots -->
    <circle cx="-15" cy="-30" r="8" fill="#7c2d12" opacity="0.8"/>
    <circle cx="10" cy="-10" r="6" fill="#7c2d12" opacity="0.7"/>
    <circle cx="-5" cy="10" r="7" fill="#92400e" opacity="0.6"/>
    <circle cx="20" cy="-35" r="5" fill="#7c2d12" opacity="0.7"/>
    <!-- Concentric rings -->
    <circle cx="-15" cy="-30" r="5" fill="none" stroke="#451a03" stroke-width="0.5" opacity="0.5"/>
    <circle cx="-15" cy="-30" r="3" fill="none" stroke="#451a03" stroke-width="0.5" opacity="0.5"/>
  </g>
</svg>
